<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bedroom display settings</title><style>body{margin:0;background:#17151c;color:#f7f5fa;font:16px system-ui,sans-serif}main{max-width:480px;margin:10vh auto;padding:28px}h1{letter-spacing:-1px;font-size:32px}p{color:#aaa4b4;line-height:1.5}label{display:block;margin:28px 0 10px}select,button{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff25;background:#2b2731;color:white;font:inherit}button{margin-top:28px;background:#dc486a;border:0;font-weight:600;cursor:pointer}a{color:#bdb6ca}#status{min-height:24px}</style><main><h1>Bedroom display</h1><p>Saved settings apply to the projector automatically and survive a restart.</p><form id="form"><label for="layout">Layout</label><select id="layout"><option value="auto">Automatic — match screen orientation</option><option value="landscape">Landscape — artwork beside details</option><option value="portrait">Portrait — artwork above details</option></select><label for="rotation">Rotate the picture</label><select id="rotation"><option value="0">0° — normal</option><option value="90">90° clockwise</option><option value="180">180° — upside down</option><option value="270">270° clockwise / 90° counterclockwise</option></select><button>Save display settings</button><p id="status" role="status"></p></form><p>Keep automatic layout and select 90° or 270° when placing the projector sideways. Choose 0° to restore normal orientation.</p><a id="preview" href="/?preview=1" target="_blank">Preview without saving</a><p><a href="/">Back to music display</a></p></main><script>
const form=document.getElementById('form'),status=document.getElementById('status'),rotation=document.getElementById('rotation'),layout=document.getElementById('layout');
fetch('/settings').then(r=>r.json()).then(s=>{rotation.value=s.rotation;layout.value=s.layout}).catch(()=>status.textContent='Unable to load settings');
document.getElementById('preview').addEventListener('click',function(){this.href='/?preview=1&rotation='+rotation.value+'&layout='+layout.value});
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Saving…';try{const r=await fetch('/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rotation:Number(rotation.value),layout:layout.value})});if(!r.ok)throw Error();status.textContent='Saved. The projector updates automatically.'}catch{status.textContent='Unable to save. Please try again.'}});
</script></html>
